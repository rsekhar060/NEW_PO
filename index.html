<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TP Dashboard</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#050816;
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  height:100vh;
  overflow:hidden;
}

/* ========================= */

.sidebar{
  width:320px;
  background:#0f172a;
  border-right:1px solid #1e293b;
  overflow-y:auto;
}

.sidebar-header{
  padding:24px;
  border-bottom:1px solid #1e293b;
}

.sidebar-title{
  font-size:28px;
  font-weight:bold;
}

.sidebar-sub{
  margin-top:8px;
  color:#94a3b8;
}

.po-item{
  padding:20px;
  border-bottom:1px solid #1e293b;
  cursor:pointer;
}

.po-item:hover{
  background:#172033;
}

.po-title{
  font-size:18px;
  font-weight:bold;
}

.po-lines{
  margin-top:6px;
  color:#94a3b8;
}

.status-dot{
  width:12px;
  height:12px;
  border-radius:50%;
  float:right;
  margin-top:6px;
}

/* ========================= */

.main{
  flex:1;
  overflow-y:auto;
  padding:30px;
}

.top-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.page-title{
  font-size:54px;
  font-weight:bold;
}

.page-sub{
  margin-top:8px;
  color:#94a3b8;
}

.export-btn{
  background:#111827;
  border:1px solid #334155;
  color:white;
  padding:14px 22px;
  border-radius:12px;
  cursor:pointer;
  font-size:15px;
}

/* ========================= */

.summary-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:18px;
  margin-bottom:40px;
}

.summary-card{
  background:#0f172a;
  border:1px solid #1e293b;
  border-radius:18px;
  padding:24px;
  cursor:pointer;
}

.summary-title{
  color:#94a3b8;
  font-size:13px;
  margin-bottom:12px;
}

.summary-value{
  font-size:48px;
  font-weight:bold;
}

.green{
  color:#22c55e;
}

.blue{
  color:#3b82f6;
}

.orange{
  color:#ff9800;
}

.purple{
  color:#a855f7;
}

/* ========================= */

.section{
  margin-top:40px;
}

.section-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:24px;
}

.section-title{
  font-size:36px;
  font-weight:bold;
}

.po-grid{
  display:grid;
  grid-template-columns:
  repeat(auto-fill,minmax(520px,1fr));
  gap:24px;
}

/* ========================= */

.item-card{
  background:#0f172a;
  border:1px solid #1e293b;
  border-radius:22px;
  padding:28px;
}

.item-title{
  font-size:28px;
  font-weight:bold;
}

.item-sub{
  color:#94a3b8;
  margin-top:6px;
}

table{
  width:100%;
  margin-top:24px;
}

th{
  color:#94a3b8;
  text-align:left;
  font-size:13px;
  padding-bottom:10px;
}

td{
  padding-bottom:20px;
  font-size:18px;
  font-weight:bold;
}

.edit-input{
  width:150px;
  padding:12px;
  background:#020617;
  border:1px solid #334155;
  border-radius:10px;
  color:white;
  font-size:17px;
}

/* ========================= */

.final-box{
  background:#091226;
  border:1px solid #243041;
  border-radius:18px;
  padding:20px;
  margin-top:18px;
}

.final-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.final-item{
  background:#111827;
  padding:14px;
  border-radius:12px;
}

.final-label{
  color:#94a3b8;
  font-size:12px;
}

.final-value{
  margin-top:6px;
  font-size:24px;
  font-weight:bold;
}

.final-status{
  margin-top:18px;
  font-size:22px;
  font-weight:bold;
}

.save-btn{
  background:#2563eb;
  border:none;
  color:white;
  padding:14px 24px;
  border-radius:12px;
  cursor:pointer;
  margin-top:24px;
  font-size:18px;
}

</style>

</head>

<body>

<div class="sidebar">

  <div class="sidebar-header">

    <div class="sidebar-title">
      TP Dashboard
    </div>

    <div class="sidebar-sub">
      Purchase Orders
    </div>

  </div>

  <div id="sidebarPOs"></div>

</div>

<div class="main">

  <div id="topDashboard"></div>

  <div id="poContent"></div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyk2qqKFw2Hdeiv0JbxH4c5C4I6Z2o4ewJYeMtzqa-XuzYHav6aM_ns5repHRDl8_iy/exec";

let GLOBAL_DATA = [];
let GLOBAL_GROUPED = {};

/* ========================= */

fetch(API_URL)
.then(res => res.json())
.then(data => {

  GLOBAL_DATA = data;

  buildDashboard(data);

});

/* ========================= */

function getStatus(r){

  if(r.REVIEWED === "YES"){
    return "REVIEWED";
  }

  const poPrice =
    Number(r.PO_PRICE || 0);

  const ucPrice =
    Number(r.UC_PRICE || 0);

  const poMRP =
    Number(r.PO_MRP || 0);

  const ucMRP =
    Number(r.UC_MRP || 0);

  const poGST =
    Number(r.PO_GST || 0);

  const ucGST =
    Number(r.UC_GST || 0);

  const diff =
    Math.abs(poPrice - ucPrice);

  if(
    diff === 0
    &&
    poMRP === ucMRP
    &&
    poGST === ucGST
  ){
    return "CLEAN";
  }

  if(
    diff <= 1
    &&
    poMRP === ucMRP
    &&
    poGST === ucGST
  ){
    return "AUTO_APPROVED";
  }

  return "NEEDS_REVIEW";

}

/* ========================= */

function buildDashboard(data){

  const grouped = {};

  data.forEach(r => {

    const po = r.PoNumber;

    if(!grouped[po]){
      grouped[po] = [];
    }

    grouped[po].push(r);

  });

  GLOBAL_GROUPED = grouped;

  renderSummary();

  renderSidebar("ALL");

}

/* ========================= */

function renderSummary(){

  let clean = 0;
  let auto = 0;
  let review = 0;
  let reviewed = 0;

  Object.keys(GLOBAL_GROUPED)
  .forEach(po => {

    GLOBAL_GROUPED[po]
    .forEach(r => {

      const s = getStatus(r);

      if(s === "CLEAN") clean++;
      if(s === "AUTO_APPROVED") auto++;
      if(s === "NEEDS_REVIEW") review++;
      if(s === "REVIEWED") reviewed++;

    });

  });

  document.getElementById(
    "topDashboard"
  ).innerHTML = `

    <div class="top-header">

      <div>

        <div class="page-title">
          TP Dashboard
        </div>

        <div class="page-sub">
          Instamart Validation Dashboard
        </div>

      </div>

    </div>

    <div class="summary-grid">

      <div class="summary-card"
      onclick="renderSidebar('ALL')">

        <div class="summary-title">
          TOTAL
        </div>

        <div class="summary-value">
          ${GLOBAL_DATA.length}
        </div>

      </div>

      <div class="summary-card"
      onclick="renderSidebar('CLEAN')">

        <div class="summary-title">
          CLEAN
        </div>

        <div class="summary-value green">
          ${clean}
        </div>

      </div>

      <div class="summary-card"
      onclick="renderSidebar('AUTO_APPROVED')">

        <div class="summary-title">
          AUTO APPROVED
        </div>

        <div class="summary-value blue">
          ${auto}
        </div>

      </div>

      <div class="summary-card"
      onclick="renderSidebar('NEEDS_REVIEW')">

        <div class="summary-title">
          NEEDS REVIEW
        </div>

        <div class="summary-value orange">
          ${review}
        </div>

      </div>

      <div class="summary-card"
      onclick="renderSidebar('REVIEWED')">

        <div class="summary-title">
          REVIEWED
        </div>

        <div class="summary-value purple">
          ${reviewed}
        </div>

      </div>

    </div>

  `;

}

/* ========================= */

function renderSidebar(filter){

  const sidebar =
    document.getElementById(
      "sidebarPOs"
    );

  sidebar.innerHTML = "";

  Object.keys(GLOBAL_GROUPED)
  .forEach(po => {

    const rows =
      GLOBAL_GROUPED[po];

    const matched =
      rows.filter(r => {

        if(filter === "ALL"){
          return true;
        }

        return getStatus(r) === filter;

      });

    if(matched.length === 0){
      return;
    }

    const div =
      document.createElement("div");

    div.className = "po-item";

    div.innerHTML = `

      <div class="po-title">
        ${po}
      </div>

      <div class="po-lines">
        ${matched.length} lines
      </div>

    `;

    div.onclick = () => {

      renderPO(po, matched);

    };

    sidebar.appendChild(div);

  });

}

/* ========================= */

function renderPO(po, rows){

  const container =
    document.getElementById(
      "poContent"
    );

  let html = `
    <div class="section">

    <div class="section-header">

      <div class="section-title">
        ${po}
      </div>

    </div>

    <div class="po-grid">
  `;

  rows.forEach(r => {

    const status =
      getStatus(r);

    html += `

      <div class="item-card">

        <div class="item-title">
          ${r.SKU_ID}
        </div>

        <div class="item-sub">
          ${r.PoNumber}
        </div>

        <table>

          <tr>
            <th>PO_PRICE</th>
            <th>UC_PRICE</th>
          </tr>

          <tr>

            <td>
              <input
              id="po_price_${r.rowNumber}"
              class="edit-input"
              value="${r.PO_PRICE}">
            </td>

            <td>
              <input
              id="price_${r.rowNumber}"
              class="edit-input"
              value="${r.UC_PRICE}">
            </td>

          </tr>

          <tr>
            <th>PO_MRP</th>
            <th>UC_MRP</th>
          </tr>

          <tr>

            <td>
              <input
              id="po_mrp_${r.rowNumber}"
              class="edit-input"
              value="${r.PO_MRP}">
            </td>

            <td>
              <input
              id="mrp_${r.rowNumber}"
              class="edit-input"
              value="${r.UC_MRP}">
            </td>

          </tr>

          <tr>
            <th>PO_GST</th>
            <th>UC_GST</th>
          </tr>

          <tr>

            <td>
              <input
              id="po_gst_${r.rowNumber}"
              class="edit-input"
              value="${r.PO_GST}">
            </td>

            <td>
              <input
              id="gst_${r.rowNumber}"
              class="edit-input"
              value="${r.UC_GST}">
            </td>

          </tr>

        </table>

        <div class="final-box">

          <div class="final-status">

            ${
              status === "REVIEWED"
              ?
              "🟪 REVIEWED"

              :

              status === "CLEAN"
              ?
              "✅ CLEAN"

              :

              status === "AUTO_APPROVED"
              ?
              "🟦 AUTO APPROVED"

              :

              "🟧 NEEDS REVIEW"
            }

          </div>

        </div>

        <button
        class="save-btn"
        onclick="saveEdit(${r.rowNumber})">

          SAVE

        </button>

      </div>

    `;

  });

  html += `
    </div>
    </div>
  `;

  container.innerHTML = html;

}

/* ========================= */

async function saveEdit(rowNumber){

  const payload = {

    rowNumber,

    PO_PRICE:
      document.getElementById(
        `po_price_${rowNumber}`
      ).value,

    PO_MRP:
      document.getElementById(
        `po_mrp_${rowNumber}`
      ).value,

    PO_GST:
      document.getElementById(
        `po_gst_${rowNumber}`
      ).value,

    UC_PRICE:
      document.getElementById(
        `price_${rowNumber}`
      ).value,

    UC_MRP:
      document.getElementById(
        `mrp_${rowNumber}`
      ).value,

    UC_GST:
      document.getElementById(
        `gst_${rowNumber}`
      ).value,

    REVIEWED:"YES"

  };

  try{

    await fetch(API_URL, {

      method:"POST",

      mode:"no-cors",

      headers:{
        "Content-Type":"application/json"
      },

      body: JSON.stringify(payload)

    });

    alert(
      "Saved Successfully"
    );

    setTimeout(() => {

      location.reload();

    },1200);

  }catch(err){

    console.log(err);

    alert(
      "Save Failed"
    );

  }

}

</script>

</body>
</html>
