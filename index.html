<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TP Dashboard</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#0b1120;
  color:white;
  display:flex;
  height:100vh;
  overflow:hidden;
}

/* ========================= */

.sidebar{
  width:320px;
  background:#111827;
  border-right:1px solid #1f2937;
  overflow-y:auto;
}

.sidebar-header{
  padding:24px;
  border-bottom:1px solid #1f2937;
}

.sidebar-title{
  font-size:28px;
  font-weight:bold;
}

.sidebar-sub{
  color:#9ca3af;
  margin-top:6px;
}

.po-item{
  padding:18px;
  border-bottom:1px solid #1f2937;
  cursor:pointer;
}

.po-item:hover{
  background:#1e293b;
}

.po-title{
  font-size:18px;
  font-weight:bold;
}

.po-lines{
  margin-top:5px;
  color:#9ca3af;
}

/* ========================= */

.main{
  flex:1;
  overflow-y:auto;
  padding:30px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.title{
  font-size:50px;
  font-weight:bold;
}

.sub{
  color:#9ca3af;
  margin-top:6px;
}

.export-btn{
  background:#2563eb;
  color:white;
  border:none;
  padding:14px 20px;
  border-radius:10px;
  cursor:pointer;
  font-size:15px;
}

/* ========================= */

.summary-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:18px;
  margin-bottom:40px;
}

.summary-card{
  background:#111827;
  border:1px solid #1f2937;
  border-radius:18px;
  padding:24px;
  cursor:pointer;
}

.summary-title{
  color:#9ca3af;
  font-size:13px;
  margin-bottom:12px;
}

.summary-value{
  font-size:46px;
  font-weight:bold;
}

.green{
  color:#22c55e;
}

.blue{
  color:#3b82f6;
}

.orange{
  color:#ff9800;
}

.purple{
  color:#a855f7;
}

/* ========================= */

.po-grid{
  display:grid;
  grid-template-columns:
  repeat(auto-fill,minmax(520px,1fr));
  gap:24px;
}

.card{
  background:#111827;
  border:1px solid #1f2937;
  border-radius:20px;
  padding:24px;
}

.sku{
  font-size:28px;
  font-weight:bold;
}

.po{
  color:#9ca3af;
  margin-top:5px;
}

/* ========================= */

table{
  width:100%;
  margin-top:20px;
}

th{
  text-align:left;
  color:#9ca3af;
  padding-bottom:8px;
  font-size:13px;
}

td{
  padding-bottom:18px;
}

input{
  width:140px;
  padding:12px;
  background:#0f172a;
  border:1px solid #334155;
  border-radius:10px;
  color:white;
  font-size:16px;
}

/* ========================= */

.status{
  margin-top:20px;
  font-size:22px;
  font-weight:bold;
}

.clean{
  color:#22c55e;
}

.auto{
  color:#3b82f6;
}

.review{
  color:#ff9800;
}

.reviewed{
  color:#a855f7;
}

.save-btn{
  margin-top:24px;
  background:#2563eb;
  color:white;
  border:none;
  padding:14px 24px;
  border-radius:10px;
  cursor:pointer;
  font-size:16px;
}

</style>

</head>

<body>

<div class="sidebar">

  <div class="sidebar-header">

    <div class="sidebar-title">
      TP Dashboard
    </div>

    <div class="sidebar-sub">
      Purchase Orders
    </div>

  </div>

  <div id="sidebar"></div>

</div>

<div class="main">

  <div class="header">

    <div>

      <div class="title">
        TP Dashboard
      </div>

      <div class="sub">
        Instamart Validation Dashboard
      </div>

    </div>

    <button
    class="export-btn"
    onclick="exportCSV()">

      EXPORT CSV

    </button>

  </div>

  <div
  class="summary-grid"
  id="summary"></div>

  <div
  class="po-grid"
  id="content"></div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyk2qqKFw2Hdeiv0JbxH4c5C4I6Z2o4ewJYeMtzqa-XuzYHav6aM_ns5repHRDl8_iy/exec";

let DATA = [];

/* ========================= */

fetch(API_URL)
.then(r => r.json())
.then(d => {

  DATA = d;

  renderSummary();

  renderSidebar();

  renderCards(DATA);

});

/* ========================= */

function getStatus(r){

  if(r.REVIEWED === "YES"){
    return "REVIEWED";
  }

  const po =
    Number(r.PO_PRICE || 0);

  const uc =
    Number(r.UC_PRICE || 0);

  const poMRP =
    Number(r.PO_MRP || 0);

  const ucMRP =
    Number(r.UC_MRP || 0);

  const poGST =
    Number(r.PO_GST || 0);

  const ucGST =
    Number(r.UC_GST || 0);

  const diff =
    Math.abs(po - uc);

  if(
    diff === 0
    &&
    poMRP === ucMRP
    &&
    poGST === ucGST
  ){
    return "CLEAN";
  }

  if(
    diff <= 1
    &&
    poMRP === ucMRP
    &&
    poGST === ucGST
  ){
    return "AUTO_APPROVED";
  }

  return "NEEDS_REVIEW";

}

/* ========================= */

function renderSummary(){

  let clean = 0;
  let auto = 0;
  let review = 0;
  let reviewed = 0;

  DATA.forEach(r => {

    const s =
      getStatus(r);

    if(s === "CLEAN") clean++;
    if(s === "AUTO_APPROVED") auto++;
    if(s === "NEEDS_REVIEW") review++;
    if(s === "REVIEWED") reviewed++;

  });

  document
  .getElementById("summary")
  .innerHTML = `

    <div class="summary-card"
    onclick="filterCards('ALL')">

      <div class="summary-title">
        TOTAL
      </div>

      <div class="summary-value">
        ${DATA.length}
      </div>

    </div>

    <div class="summary-card"
    onclick="filterCards('CLEAN')">

      <div class="summary-title">
        CLEAN
      </div>

      <div class="summary-value green">
        ${clean}
      </div>

    </div>

    <div class="summary-card"
    onclick="filterCards('AUTO_APPROVED')">

      <div class="summary-title">
        AUTO APPROVED
      </div>

      <div class="summary-value blue">
        ${auto}
      </div>

    </div>

    <div class="summary-card"
    onclick="filterCards('NEEDS_REVIEW')">

      <div class="summary-title">
        NEEDS REVIEW
      </div>

      <div class="summary-value orange">
        ${review}
      </div>

    </div>

    <div class="summary-card"
    onclick="filterCards('REVIEWED')">

      <div class="summary-title">
        REVIEWED
      </div>

      <div class="summary-value purple">
        ${reviewed}
      </div>

    </div>

  `;

}

/* ========================= */

function renderSidebar(){

  const grouped = {};

  DATA.forEach(r => {

    if(!grouped[r.PoNumber]){
      grouped[r.PoNumber] = [];
    }

    grouped[r.PoNumber].push(r);

  });

  let html = "";

  Object.keys(grouped)
  .forEach(po => {

    html += `

      <div
      class="po-item"
      onclick="showPO('${po}')">

        <div class="po-title">
          ${po}
        </div>

        <div class="po-lines">
          ${grouped[po].length} lines
        </div>

      </div>

    `;

  });

  document
  .getElementById("sidebar")
  .innerHTML = html;

}

/* ========================= */

function showPO(po){

  const rows =
    DATA.filter(r =>
      r.PoNumber === po
    );

  renderCards(rows);

}

/* ========================= */

function filterCards(type){

  if(type === "ALL"){
    renderCards(DATA);
    return;
  }

  const rows =
    DATA.filter(r =>
      getStatus(r) === type
    );

  renderCards(rows);

}

/* ========================= */

function renderCards(rows){

  let html = "";

  rows.forEach(r => {

    const status =
      getStatus(r);

    let cls = "review";
    let label = "🟧 NEEDS REVIEW";

    if(status === "CLEAN"){
      cls = "clean";
      label = "✅ CLEAN";
    }

    if(status === "AUTO_APPROVED"){
      cls = "auto";
      label = "🟦 AUTO APPROVED";
    }

    if(status === "REVIEWED"){
      cls = "reviewed";
      label = "🟪 REVIEWED";
    }

    html += `

      <div class="card">

        <div class="sku">
          ${r.SKU_ID}
        </div>

        <div class="po">
          ${r.PoNumber}
        </div>

        <table>

          <tr>
            <th>PO_PRICE</th>
            <th>UC_PRICE</th>
          </tr>

          <tr>

            <td>

              <input
              id="po_price_${r.rowNumber}"
              value="${r.PO_PRICE}">

            </td>

            <td>

              <input
              id="uc_price_${r.rowNumber}"
              value="${r.UC_PRICE}">

            </td>

          </tr>

          <tr>
            <th>PO_MRP</th>
            <th>UC_MRP</th>
          </tr>

          <tr>

            <td>

              <input
              id="po_mrp_${r.rowNumber}"
              value="${r.PO_MRP}">

            </td>

            <td>

              <input
              id="uc_mrp_${r.rowNumber}"
              value="${r.UC_MRP}">

            </td>

          </tr>

          <tr>
            <th>PO_GST</th>
            <th>UC_GST</th>
          </tr>

          <tr>

            <td>

              <input
              id="po_gst_${r.rowNumber}"
              value="${r.PO_GST}">

            </td>

            <td>

              <input
              id="uc_gst_${r.rowNumber}"
              value="${r.UC_GST}">

            </td>

          </tr>

        </table>

        <div
        class="status ${cls}">

          ${label}

        </div>

        <button
        class="save-btn"
        onclick="saveEdit(${r.rowNumber})">

          SAVE

        </button>

      </div>

    `;

  });

  document
  .getElementById("content")
  .innerHTML = html;

}

/* ========================= */

async function saveEdit(rowNumber){

  const payload = {

    rowNumber,

    PO_PRICE:
      document.getElementById(
        `po_price_${rowNumber}`
      ).value,

    PO_MRP:
      document.getElementById(
        `po_mrp_${rowNumber}`
      ).value,

    PO_GST:
      document.getElementById(
        `po_gst_${rowNumber}`
      ).value,

    UC_PRICE:
      document.getElementById(
        `uc_price_${rowNumber}`
      ).value,

    UC_MRP:
      document.getElementById(
        `uc_mrp_${rowNumber}`
      ).value,

    UC_GST:
      document.getElementById(
        `uc_gst_${rowNumber}`
      ).value,

    REVIEWED:"YES"

  };

  try{

    await fetch(API_URL, {

      method:"POST",

      mode:"no-cors",

      headers:{
        "Content-Type":"application/json"
      },

      body: JSON.stringify(payload)

    });

    alert(
      "Saved Successfully"
    );

    setTimeout(() => {

      location.reload();

    },1200);

  }catch(err){

    console.log(err);

    alert(
      "Save Failed"
    );

  }

}

/* ========================= */

function exportCSV(){

  let csv = [];

  csv.push([

    "PoNumber",
    "SKU_ID",

    "PO_PRICE",
    "UC_PRICE",

    "PO_MRP",
    "UC_MRP",

    "PO_GST",
    "UC_GST",

    "STATUS"

  ]);

  DATA.forEach(r => {

    csv.push([

      r.PoNumber,
      r.SKU_ID,

      r.PO_PRICE,
      r.UC_PRICE,

      r.PO_MRP,
      r.UC_MRP,

      r.PO_GST,
      r.UC_GST,

      getStatus(r)

    ]);

  });

  const csvContent =
    csv.map(e =>
      e.join(",")
    ).join("\n");

  const blob =
    new Blob(
      [csvContent],
      {
        type:"text/csv"
      }
    );

  const a =
    document.createElement("a");

  a.href =
    URL.createObjectURL(blob);

  a.download =
    "TP_Dashboard.csv";

  a.click();

}

</script>

</body>
</html>
