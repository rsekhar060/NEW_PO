<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TP Dashboard</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#0b0f17;
  color:white;
  font-family:Arial;
  display:flex;
  height:100vh;
  overflow:hidden;
}

/* SIDEBAR */

.sidebar{
  width:280px;
  background:#111827;
  border-right:1px solid #1f2937;
  overflow-y:auto;
}

.sidebar-header{
  padding:20px;
  border-bottom:1px solid #1f2937;
}

.sidebar-title{
  font-size:24px;
  font-weight:bold;
}

.sidebar-sub{
  color:#9ca3af;
  margin-top:5px;
}

.po-item{
  padding:18px;
  border-bottom:1px solid #1f2937;
  cursor:pointer;
  transition:0.2s;
}

.po-item:hover{
  background:#1f2937;
}

.po-item.active{
  background:#1f2937;
}

.po-title{
  font-size:18px;
  font-weight:bold;
}

.po-lines{
  color:#9ca3af;
  margin-top:5px;
}

.status-dot{
  width:10px;
  height:10px;
  border-radius:50%;
  float:right;
  margin-top:7px;
}

/* MAIN */

.main{
  flex:1;
  overflow-y:auto;
  padding:30px;
}

/* HEADER */

.top-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.page-title{
  font-size:36px;
  font-weight:bold;
}

.page-sub{
  color:#9ca3af;
  margin-top:6px;
}

/* BUTTON */

.export-btn{
  background:#111827;
  border:1px solid #374151;
  color:white;
  padding:12px 20px;
  border-radius:10px;
  cursor:pointer;
}

.export-btn:hover{
  background:#1f2937;
}

/* SUMMARY */

.summary-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:18px;
  margin-bottom:40px;
}

.summary-card{
  background:#111827;
  border:1px solid #1f2937;
  border-radius:18px;
  padding:24px;
}

.summary-title{
  color:#9ca3af;
  font-size:13px;
  margin-bottom:10px;
  letter-spacing:1px;
}

.summary-value{
  font-size:40px;
  font-weight:bold;
}

.green{
  color:#22c55e;
}

.orange{
  color:#ff8a00;
}

.blue{
  color:#3b82f6;
}

/* SECTION */

.section{
  margin-top:40px;
}

.section-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.section-title{
  font-size:28px;
  font-weight:bold;
}

/* GRID */

.po-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(420px,1fr));
  gap:20px;
}

/* CARD */

.item-card{
  background:#111827;
  border:1px solid #1f2937;
  border-radius:18px;
  padding:24px;
}

.item-title{
  font-size:22px;
  font-weight:bold;
}

.item-sub{
  color:#9ca3af;
  margin-top:6px;
}

table{
  width:100%;
  margin-top:20px;
  border-collapse:collapse;
}

th{
  color:#9ca3af;
  font-size:12px;
  font-weight:normal;
  padding-bottom:10px;
}

td{
  font-size:20px;
  font-weight:bold;
}

td,th{
  text-align:left;
}

/* INPUT */

.edit-input{
  width:120px;
  padding:10px;
  background:#0b0f17;
  border:1px solid #374151;
  border-radius:8px;
  color:white;
}

/* BADGES */

.badge{
  display:inline-block;
  padding:8px 12px;
  border-radius:8px;
  font-size:12px;
  font-weight:bold;
  margin-top:18px;
}

.clean-badge{
  background:#052e16;
  color:#22c55e;
}

.review-badge{
  background:#3b0a0a;
  color:#ff8a00;
}

.auto-badge{
  background:#0a1f44;
  color:#3b82f6;
}

/* REASON */

.reason{
  margin-top:16px;
  padding:12px;
  border-radius:10px;
  font-size:13px;
  background:#1f2937;
  color:#d1d5db;
}

/* SAVE BUTTON */

.save-btn{
  margin-top:18px;
  background:#2563eb;
  border:none;
  color:white;
  padding:10px 18px;
  border-radius:8px;
  cursor:pointer;
}

.save-btn:hover{
  background:#1d4ed8;
}

.empty{
  color:#9ca3af;
  padding:20px;
}

</style>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

  <div class="sidebar-header">

    <div class="sidebar-title">
      TP Dashboard
    </div>

    <div class="sidebar-sub">
      Purchase Orders
    </div>

  </div>

  <div id="sidebarPOs"></div>

</div>

<!-- MAIN -->

<div class="main">

  <div id="topDashboard"></div>

  <div id="poContent"></div>

</div>

<script>

/* ========================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbzIdMrvue0iLwzRNCJ-fF4f_haVsUBNHIyIakl77XP66RG84yNZPoEIPgB1NwmMprzH/exec";

/* ========================================= */

let GLOBAL_DATA = [];
let GLOBAL_GROUPED = {};

/* ========================================= */

fetch(API_URL)
.then(res => res.json())
.then(data => {

  GLOBAL_DATA = data;

  buildDashboard(data);

});

/* ========================================= */

function buildDashboard(data){

  const grouped = {};

  data.forEach(r => {

    const po = r.PoNumber;

    if(!grouped[po]){
      grouped[po] = [];
    }

    grouped[po].push(r);

  });

  GLOBAL_GROUPED = grouped;

  let cleanPOs = 0;
  let reviewPOs = 0;
  let autoPOs = 0;

  Object.keys(grouped).forEach(po => {

    const rows = grouped[po];

    let hasReview = false;
    let hasAuto = false;

    rows.forEach(r => {

      const diff =
        Math.abs(
          Number(r.PO_PRICE || 0)
          -
          Number(r.UC_PRICE || 0)
        );

      if(diff > 1){
        hasReview = true;
      }
      else if(diff > 0){
        hasAuto = true;
      }

    });

    if(hasReview){
      reviewPOs++;
    }
    else if(hasAuto){
      autoPOs++;
    }
    else{
      cleanPOs++;
    }

    addSidebarPO(
      po,
      rows,
      hasReview,
      hasAuto
    );

  });

  document.getElementById("topDashboard")
  .innerHTML = `

    <div class="top-header">

      <div>

        <div class="page-title">
          TP Dashboard
        </div>

        <div class="page-sub">
          Instamart Validation Dashboard
        </div>

      </div>

      <button class="export-btn"
      onclick="exportAll()">

        EXPORT ALL

      </button>

    </div>

    <div class="summary-grid">

      <div class="summary-card">

        <div class="summary-title">
          TOTAL POs
        </div>

        <div class="summary-value">
          ${Object.keys(grouped).length}
        </div>

      </div>

      <div class="summary-card">

        <div class="summary-title">
          PO LINES
        </div>

        <div class="summary-value">
          ${data.length}
        </div>

      </div>

      <div class="summary-card">

        <div class="summary-title">
          CLEAN
        </div>

        <div class="summary-value green">
          ${cleanPOs}
        </div>

      </div>

      <div class="summary-card">

        <div class="summary-title">
          AUTO APPROVED
        </div>

        <div class="summary-value blue">
          ${autoPOs}
        </div>

      </div>

      <div class="summary-card">

        <div class="summary-title">
          NEEDS REVIEW
        </div>

        <div class="summary-value orange">
          ${reviewPOs}
        </div>

      </div>

    </div>

  `;

  const firstPO =
    Object.keys(grouped)[0];

  renderPO(firstPO);

}

/* ========================================= */

function addSidebarPO(
  po,
  rows,
  hasReview,
  hasAuto
){

  let color = "#22c55e";

  if(hasReview){
    color = "#ff8a00";
  }
  else if(hasAuto){
    color = "#3b82f6";
  }

  const div =
    document.createElement("div");

  div.className = "po-item";

  div.onclick = () => {

    document
      .querySelectorAll(".po-item")
      .forEach(x => x.classList.remove("active"));

    div.classList.add("active");

    renderPO(po);

  };

  div.innerHTML = `

    <div class="po-title">

      ${po}

      <span class="status-dot"
      style="background:${color}">
      </span>

    </div>

    <div class="po-lines">
      ${rows.length} lines
    </div>

  `;

  document
    .getElementById("sidebarPOs")
    .appendChild(div);

}

/* ========================================= */

function renderPO(po){

  const rows =
    GLOBAL_GROUPED[po];

  let reviewHTML = "";
  let autoHTML = "";
  let cleanHTML = "";

  rows.forEach(r => {

    const poPrice =
      Number(r.PO_PRICE || 0);

    const ucPrice =
      Number(r.UC_PRICE || 0);

    const diff =
      Math.abs(poPrice - ucPrice);

    let status = "";
    let badge = "";
    let reason = "";

    if(diff === 0){

      status = "clean";

      badge =
      `<span class="badge clean-badge">
        CLEAN
      </span>`;

      reason =
      "TP matches exactly";

    }
    else if(diff <= 1){

      status = "auto";

      badge =
      `<span class="badge auto-badge">
        AUTO APPROVED
      </span>`;

      reason =
      "Diff less than ₹1";

    }
    else{

      status = "review";

      badge =
      `<span class="badge review-badge">
        NEEDS REVIEW
      </span>`;

      reason =
      "Large TP mismatch";

    }

    const card = `

      <div class="item-card">

        <div class="item-title">
          ${r.SKU_ID}
        </div>

        <div class="item-sub">
          PO ${po}
        </div>

        <table>

          <tr>

            <th>PO_PRICE</th>
            <th>UC_PRICE</th>
            <th>DIFF</th>

          </tr>

          <tr>

            <td>
              ₹${poPrice}
            </td>

            <td>

              <input
                id="price_${r.rowNumber}"
                class="edit-input"
                value="${ucPrice}"
              >

            </td>

            <td>
              ₹${diff.toFixed(2)}
            </td>

          </tr>

        </table>

        <br>

        <input
          id="mrp_${r.rowNumber}"
          class="edit-input"
          value="${r.UC_MRP}"
          placeholder="UC_MRP"
        >

        <input
          id="gst_${r.rowNumber}"
          class="edit-input"
          value="${r.UC_GST}"
          placeholder="UC_GST"
        >

        <br>

        <button
          class="save-btn"
          onclick="saveEdit(${r.rowNumber})"
        >

          SAVE

        </button>

        <br>

        ${badge}

        <div class="reason">
          ${reason}
        </div>

      </div>

    `;

    if(status === "clean"){
      cleanHTML += card;
    }

    if(status === "auto"){
      autoHTML += card;
    }

    if(status === "review"){
      reviewHTML += card;
    }

  });

  document.getElementById("poContent")
  .innerHTML = `

    <div class="section">

      <div class="section-header">

        <div class="section-title">
          ${po}
        </div>

        <button class="export-btn"
        onclick="exportPO('${po}')">

          EXPORT PO

        </button>

      </div>

    </div>

    <div class="section">

      <div class="section-header">

        <div class="section-title">
          Needs Review
        </div>

      </div>

      <div class="po-grid">

        ${reviewHTML || '<div class="empty">No review lines</div>'}

      </div>

    </div>

    <div class="section">

      <div class="section-header">

        <div class="section-title">
          Auto Approved
        </div>

      </div>

      <div class="po-grid">

        ${autoHTML || '<div class="empty">No auto approved lines</div>'}

      </div>

    </div>

    <div class="section">

      <div class="section-header">

        <div class="section-title">
          Clean
        </div>

      </div>

      <div class="po-grid">

        ${cleanHTML || '<div class="empty">No clean lines</div>'}

      </div>

    </div>

  `;

}

/* ========================================= */

async function saveEdit(rowNumber){

  const UC_PRICE =
    document.getElementById(
      `price_${rowNumber}`
    ).value;

  const UC_GST =
    document.getElementById(
      `gst_${rowNumber}`
    ).value;

  const UC_MRP =
    document.getElementById(
      `mrp_${rowNumber}`
    ).value;

  await fetch(API_URL, {

    method:"POST",

    body: JSON.stringify({

      rowNumber,
      UC_PRICE,
      UC_GST,
      UC_MRP

    })

  });

  alert("Updated Successfully");

  location.reload();

}

/* ========================================= */

function exportPO(po){

  const rows =
    GLOBAL_GROUPED[po];

  let csv =
`PoNumber,SKU_ID,PO_PRICE,UC_PRICE,DIFF,STATUS\n`;

  rows.forEach(r => {

    const diff =
      Math.abs(
        Number(r.PO_PRICE || 0)
        -
        Number(r.UC_PRICE || 0)
      );

    let status = "REVIEW";

    if(diff === 0){
      status = "CLEAN";
    }
    else if(diff <= 1){
      status = "AUTO_APPROVED";
    }

    csv +=
`${r.PoNumber},
${r.SKU_ID},
${r.PO_PRICE},
${r.UC_PRICE},
${diff},
${status}\n`;

  });

  downloadCSV(csv, po + ".csv");

}

/* ========================================= */

function exportAll(){

  let csv =
`PoNumber,SKU_ID,PO_PRICE,UC_PRICE,DIFF,STATUS\n`;

  GLOBAL_DATA.forEach(r => {

    const diff =
      Math.abs(
        Number(r.PO_PRICE || 0)
        -
        Number(r.UC_PRICE || 0)
      );

    let status = "REVIEW";

    if(diff === 0){
      status = "CLEAN";
    }
    else if(diff <= 1){
      status = "AUTO_APPROVED";
    }

    csv +=
`${r.PoNumber},
${r.SKU_ID},
${r.PO_PRICE},
${r.UC_PRICE},
${diff},
${status}\n`;

  });

  downloadCSV(csv, "ALL_POS.csv");

}

/* ========================================= */

function downloadCSV(csv, filename){

  const blob =
    new Blob([csv], {
      type:'text/csv'
    });

  const a =
    document.createElement('a');

  a.href =
    URL.createObjectURL(blob);

  a.download =
    filename;

  a.click();

}

</script>

</body>
</html>
