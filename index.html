<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>TP Dashboard</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#0b0f17;
  color:white;
  font-family:Arial;
  display:flex;
  height:100vh;
  overflow:hidden;
}

/* SIDEBAR */

.sidebar{
  width:280px;
  background:#111827;
  border-right:1px solid #1f2937;
  overflow-y:auto;
}

.sidebar-header{
  padding:20px;
  border-bottom:1px solid #1f2937;
}

.sidebar-title{
  font-size:24px;
  font-weight:bold;
}

.sidebar-sub{
  color:#9ca3af;
  margin-top:5px;
}

.po-item{
  padding:18px;
  border-bottom:1px solid #1f2937;
  cursor:pointer;
}

.po-item:hover{
  background:#1f2937;
}

.po-title{
  font-size:18px;
  font-weight:bold;
}

.po-lines{
  color:#9ca3af;
  margin-top:5px;
}

.status-dot{
  width:10px;
  height:10px;
  border-radius:50%;
  float:right;
  margin-top:8px;
}

/* MAIN */

.main{
  flex:1;
  overflow-y:auto;
  padding:30px;
}

/* TOP */

.top-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.page-title{
  font-size:36px;
  font-weight:bold;
}

.page-sub{
  color:#9ca3af;
  margin-top:6px;
}

/* BUTTON */

.export-btn{
  background:#111827;
  border:1px solid #374151;
  color:white;
  padding:12px 20px;
  border-radius:10px;
  cursor:pointer;
}

.export-btn:hover{
  background:#1f2937;
}

.save-btn{
  background:#2563eb;
  border:none;
  color:white;
  padding:10px 18px;
  border-radius:8px;
  cursor:pointer;
  margin-top:18px;
}

/* SUMMARY */

.summary-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:18px;
  margin-bottom:40px;
}

.summary-card{
  background:#111827;
  border:1px solid #1f2937;
  border-radius:18px;
  padding:24px;
}

.summary-title{
  color:#9ca3af;
  font-size:13px;
  margin-bottom:10px;
}

.summary-value{
  font-size:40px;
  font-weight:bold;
}

.green{
  color:#22c55e;
}

.orange{
  color:#ff8a00;
}

.blue{
  color:#3b82f6;
}

/* SECTION */

.section{
  margin-top:40px;
}

.section-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.section-title{
  font-size:28px;
  font-weight:bold;
}

/* GRID */

.po-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(420px,1fr));
  gap:20px;
}

/* CARD */

.item-card{
  background:#111827;
  border:1px solid #1f2937;
  border-radius:18px;
  padding:24px;
}

.item-title{
  font-size:22px;
  font-weight:bold;
}

.item-sub{
  color:#9ca3af;
  margin-top:6px;
}

/* TABLE */

table{
  width:100%;
  margin-top:20px;
  border-collapse:collapse;
}

th{
  color:#9ca3af;
  font-size:12px;
  font-weight:normal;
  padding-bottom:10px;
}

td{
  font-size:18px;
  font-weight:bold;
}

td,th{
  text-align:left;
}

/* INPUT */

.edit-input{
  width:120px;
  padding:10px;
  background:#0b0f17;
  border:1px solid #374151;
  border-radius:8px;
  color:white;
}

/* BADGES */

.badge{
  display:inline-block;
  padding:8px 12px;
  border-radius:8px;
  font-size:12px;
  font-weight:bold;
  margin-top:18px;
}

.clean-badge{
  background:#052e16;
  color:#22c55e;
}

.review-badge{
  background:#3b0a0a;
  color:#ff8a00;
}

.auto-badge{
  background:#0a1f44;
  color:#3b82f6;
}

/* REASON */

.reason{
  margin-top:16px;
  padding:12px;
  border-radius:10px;
  font-size:13px;
  background:#1f2937;
  color:#d1d5db;
}

.empty{
  color:#9ca3af;
  padding:20px;
}

</style>

</head>

<body>

<div class="sidebar">

  <div class="sidebar-header">

    <div class="sidebar-title">
      TP Dashboard
    </div>

    <div class="sidebar-sub">
      Purchase Orders
    </div>

  </div>

  <div id="sidebarPOs"></div>

</div>

<div class="main">

  <div id="topDashboard"></div>

  <div id="poContent"></div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbx3f0u4g7MQnphRX22C5VHpersJN8QPG9pfS4g3pBOaMDf1EHv2cu_6vRe3iV5VdHyY/exec";

let GLOBAL_DATA = [];
let GLOBAL_GROUPED = {};

/* ===================================== */

fetch(API_URL)
.then(res => res.json())
.then(data => {

  GLOBAL_DATA = data;

  buildDashboard(data);

});

/* ===================================== */

function buildDashboard(data){

  const grouped = {};

  data.forEach(r => {

    const po = r.PoNumber;

    if(!grouped[po]){
      grouped[po] = [];
    }

    grouped[po].push(r);

  });

  GLOBAL_GROUPED = grouped;

  let cleanPOs = 0;
  let reviewPOs = 0;
  let autoPOs = 0;

  Object.keys(grouped).forEach(po => {

    const rows = grouped[po];

    let hasReview = false;
    let hasAuto = false;

    rows.forEach(r => {

      const poPrice =
        Number(r.PO_PRICE || 0);

      const ucPrice =
        Number(r.UC_PRICE || 0);

      const poMRP =
        Number(r.PO_MRP || 0);

      const ucMRP =
        Number(r.UC_MRP || 0);

      const poGST =
        Number(r.PO_GST || 0);

      const ucGST =
        Number(r.UC_GST || 0);

      const priceDiff =
        Math.abs(poPrice - ucPrice);

      const mrpMatch =
        poMRP === ucMRP;

      const gstMatch =
        poGST === ucGST;

      if(
        priceDiff > 1
        ||
        !mrpMatch
        ||
        !gstMatch
      ){
        hasReview = true;
      }
      else if(priceDiff > 0){
        hasAuto = true;
      }

    });

    if(hasReview){
      reviewPOs++;
    }
    else if(hasAuto){
      autoPOs++;
    }
    else{
      cleanPOs++;
    }

    addSidebarPO(
      po,
      rows,
      hasReview,
      hasAuto
    );

  });

  document.getElementById("topDashboard")
  .innerHTML = `

    <div class="top-header">

      <div>

        <div class="page-title">
          TP Dashboard
        </div>

        <div class="page-sub">
          Instamart Validation Dashboard
        </div>

      </div>

      <button class="export-btn"
      onclick="exportAll()">

        EXPORT ALL

      </button>

    </div>

    <div class="summary-grid">

      <div class="summary-card">
        <div class="summary-title">
          TOTAL POs
        </div>
        <div class="summary-value">
          ${Object.keys(grouped).length}
        </div>
      </div>

      <div class="summary-card">
        <div class="summary-title">
          PO LINES
        </div>
        <div class="summary-value">
          ${data.length}
        </div>
      </div>

      <div class="summary-card">
        <div class="summary-title">
          CLEAN
        </div>
        <div class="summary-value green">
          ${cleanPOs}
        </div>
      </div>

      <div class="summary-card">
        <div class="summary-title">
          AUTO APPROVED
        </div>
        <div class="summary-value blue">
          ${autoPOs}
        </div>
      </div>

      <div class="summary-card">
        <div class="summary-title">
          NEEDS REVIEW
        </div>
        <div class="summary-value orange">
          ${reviewPOs}
        </div>
      </div>

    </div>

  `;

  const firstPO =
    Object.keys(grouped)[0];

  renderPO(firstPO);

}

/* ===================================== */

function addSidebarPO(
  po,
  rows,
  hasReview,
  hasAuto
){

  let color = "#22c55e";

  if(hasReview){
    color = "#ff8a00";
  }
  else if(hasAuto){
    color = "#3b82f6";
  }

  const div =
    document.createElement("div");

  div.className = "po-item";

  div.onclick = () => {

    renderPO(po);

  };

  div.innerHTML = `

    <div class="po-title">

      ${po}

      <span class="status-dot"
      style="background:${color}">
      </span>

    </div>

    <div class="po-lines">
      ${rows.length} lines
    </div>

  `;

  document
    .getElementById("sidebarPOs")
    .appendChild(div);

}

/* ===================================== */

function renderPO(po){

  const rows =
    GLOBAL_GROUPED[po];

  let reviewHTML = "";
  let autoHTML = "";
  let cleanHTML = "";

  rows.forEach(r => {

    const poPrice =
      Number(r.PO_PRICE || 0);

    const ucPrice =
      Number(r.UC_PRICE || 0);

    const poMRP =
      Number(r.PO_MRP || 0);

    const ucMRP =
      Number(r.UC_MRP || 0);

    const poGST =
      Number(r.PO_GST || 0);

    const ucGST =
      Number(r.UC_GST || 0);

    const priceDiff =
      Math.abs(poPrice - ucPrice);

    const mrpMatch =
      poMRP === ucMRP;

    const gstMatch =
      poGST === ucGST;

    let status = "";
    let badge = "";
    let reason = "";

    if(
      priceDiff === 0
      &&
      mrpMatch
      &&
      gstMatch
    ){

      status = "clean";

      badge =
      `<span class="badge clean-badge">
        CLEAN
      </span>`;

      reason =
      "PRICE, GST & MRP matched";

    }
    else if(
      priceDiff <= 1
      &&
      mrpMatch
      &&
      gstMatch
    ){

      status = "auto";

      badge =
      `<span class="badge auto-badge">
        AUTO APPROVED
      </span>`;

      reason =
      "PRICE diff below ₹1";

    }
    else{

      status = "review";

      badge =
      `<span class="badge review-badge">
        NEEDS REVIEW
      </span>`;

      reason =
      "PRICE / GST / MRP mismatch";

    }

    const card = `

      <div class="item-card">

        <div class="item-title">
          ${r.SKU_ID}
        </div>

        <div class="item-sub">
          PO ${po}
        </div>

        <table>

          <tr>

            <th>PO_PRICE</th>
            <th>UC_PRICE</th>
            <th>PRICE_DIFF</th>

          </tr>

          <tr>

            <td>

              <input
                id="po_price_${r.rowNumber}"
                class="edit-input"
                value="${poPrice}"
              >

            </td>

            <td>

              <input
                id="price_${r.rowNumber}"
                class="edit-input"
                value="${ucPrice}"
              >

            </td>

            <td>
              ₹${priceDiff.toFixed(2)}
            </td>

          </tr>

          <tr>

            <th>PO_MRP</th>
            <th>UC_MRP</th>
            <th>MRP_STATUS</th>

          </tr>

          <tr>

            <td>

              <input
                id="po_mrp_${r.rowNumber}"
                class="edit-input"
                value="${poMRP}"
              >

            </td>

            <td>

              <input
                id="mrp_${r.rowNumber}"
                class="edit-input"
                value="${ucMRP}"
              >

            </td>

            <td>

              ${
                mrpMatch
                ?
                '✅ MATCH'
                :
                '❌ MISMATCH'
              }

            </td>

          </tr>

          <tr>

            <th>PO_GST</th>
            <th>UC_GST</th>
            <th>GST_STATUS</th>

          </tr>

          <tr>

            <td>

              <input
                id="po_gst_${r.rowNumber}"
                class="edit-input"
                value="${poGST}"
              >

            </td>

            <td>

              <input
                id="gst_${r.rowNumber}"
                class="edit-input"
                value="${ucGST}"
              >

            </td>

            <td>

              ${
                gstMatch
                ?
                '✅ MATCH'
                :
                '❌ MISMATCH'
              }

            </td>

          </tr>

        </table>

        <button
          class="save-btn"
          onclick="saveEdit(${r.rowNumber})">

          SAVE

        </button>

        <br>

        ${badge}

        <div class="reason">
          ${reason}
        </div>

      </div>

    `;

    if(status === "clean"){
      cleanHTML += card;
    }

    if(status === "auto"){
      autoHTML += card;
    }

    if(status === "review"){
      reviewHTML += card;
    }

  });

  document.getElementById("poContent")
  .innerHTML = `

    <div class="section">

      <div class="section-header">

        <div class="section-title">
          ${po}
        </div>

        <button class="export-btn"
        onclick="exportPO('${po}')">

          EXPORT PO

        </button>

      </div>

    </div>

    <div class="section">

      <div class="section-header">
        <div class="section-title">
          Needs Review
        </div>
      </div>

      <div class="po-grid">

        ${reviewHTML || '<div class="empty">No review lines</div>'}

      </div>

    </div>

    <div class="section">

      <div class="section-header">
        <div class="section-title">
          Auto Approved
        </div>
      </div>

      <div class="po-grid">

        ${autoHTML || '<div class="empty">No auto approved lines</div>'}

      </div>

    </div>

    <div class="section">

      <div class="section-header">
        <div class="section-title">
          Clean
        </div>
      </div>

      <div class="po-grid">

        ${cleanHTML || '<div class="empty">No clean lines</div>'}

      </div>

    </div>

  `;

}

/* ===================================== */

async function saveEdit(rowNumber){

  const PO_PRICE =
    document.getElementById(
      `po_price_${rowNumber}`
    ).value;

  const PO_MRP =
    document.getElementById(
      `po_mrp_${rowNumber}`
    ).value;

  const PO_GST =
    document.getElementById(
      `po_gst_${rowNumber}`
    ).value;

  const UC_PRICE =
    document.getElementById(
      `price_${rowNumber}`
    ).value;

  const UC_GST =
    document.getElementById(
      `gst_${rowNumber}`
    ).value;

  const UC_MRP =
    document.getElementById(
      `mrp_${rowNumber}`
    ).value;

  await fetch(API_URL, {

    method:"POST",

    body: JSON.stringify({

      rowNumber,

      PO_PRICE,
      PO_MRP,
      PO_GST,

      UC_PRICE,
      UC_GST,
      UC_MRP

    })

  });

  alert("Updated Successfully");

  location.reload();

}

/* ===================================== */

function exportPO(po){

  const rows =
    GLOBAL_GROUPED[po];

  exportCSV(rows, po + ".csv");

}

/* ===================================== */

function exportAll(){

  exportCSV(
    GLOBAL_DATA,
    "ALL_POS.csv"
  );

}

/* ===================================== */

function exportCSV(rows, filename){

  let csvRows = [];

  csvRows.push([

    "PoNumber",
    "SKU_ID",

    "PO_PRICE",
    "UC_PRICE",
    "PRICE_DIFF",

    "PO_MRP",
    "UC_MRP",
    "MRP_STATUS",

    "PO_GST",
    "UC_GST",
    "GST_STATUS",

    "FINAL_STATUS"

  ]);

  rows.forEach(r => {

    const poPrice =
      Number(r.PO_PRICE || 0);

    const ucPrice =
      Number(r.UC_PRICE || 0);

    const poMRP =
      Number(r.PO_MRP || 0);

    const ucMRP =
      Number(r.UC_MRP || 0);

    const poGST =
      Number(r.PO_GST || 0);

    const ucGST =
      Number(r.UC_GST || 0);

    const priceDiff =
      Math.abs(poPrice - ucPrice);

    const mrpStatus =
      poMRP === ucMRP
      ? "MATCH"
      : "MISMATCH";

    const gstStatus =
      poGST === ucGST
      ? "MATCH"
      : "MISMATCH";

    let finalStatus = "REVIEW";

    if(
      priceDiff === 0
      &&
      mrpStatus === "MATCH"
      &&
      gstStatus === "MATCH"
    ){
      finalStatus = "CLEAN";
    }
    else if(
      priceDiff <= 1
      &&
      mrpStatus === "MATCH"
      &&
      gstStatus === "MATCH"
    ){
      finalStatus = "AUTO_APPROVED";
    }

    csvRows.push([

      r.PoNumber,
      r.SKU_ID,

      poPrice,
      ucPrice,
      priceDiff.toFixed(2),

      poMRP,
      ucMRP,
      mrpStatus,

      poGST,
      ucGST,
      gstStatus,

      finalStatus

    ]);

  });

  const csvContent =
    csvRows
    .map(e => e.join(","))
    .join("\n");

  downloadCSV(
    csvContent,
    filename
  );

}

/* ===================================== */

function downloadCSV(csv, filename){

  const blob =
    new Blob([csv], {
      type:'text/csv'
    });

  const a =
    document.createElement('a');

  a.href =
    URL.createObjectURL(blob);

  a.download =
    filename;

  a.click();

}

</script>

</body>
</html>
