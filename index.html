<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>TP Dashboard</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#0b0f17;
  color:white;
  font-family:Arial;
  display:flex;
  height:100vh;
  overflow:hidden;
}

.sidebar{
  width:320px;
  background:#111827;
  border-right:1px solid #1f2937;
  overflow-y:auto;
}

.sidebar-header{
  padding:24px;
  border-bottom:1px solid #1f2937;
}

.sidebar-title{
  font-size:24px;
  font-weight:bold;
}

.sidebar-sub{
  color:#9ca3af;
  margin-top:8px;
}

.po-item{
  padding:20px;
  border-bottom:1px solid #1f2937;
  cursor:pointer;
}

.po-item:hover{
  background:#1f2937;
}

.po-title{
  font-size:18px;
  font-weight:bold;
}

.po-lines{
  color:#9ca3af;
  margin-top:5px;
}

.status-dot{
  width:10px;
  height:10px;
  border-radius:50%;
  float:right;
  margin-top:8px;
}

.main{
  flex:1;
  overflow-y:auto;
  padding:30px;
}

.top-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.page-title{
  font-size:40px;
  font-weight:bold;
}

.page-sub{
  color:#9ca3af;
  margin-top:8px;
}

.summary-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:18px;
  margin-bottom:40px;
}

.summary-card{
  background:#111827;
  border:1px solid #1f2937;
  border-radius:18px;
  padding:24px;
  cursor:pointer;
}

.summary-title{
  color:#9ca3af;
  font-size:13px;
  margin-bottom:10px;
}

.summary-value{
  font-size:42px;
  font-weight:bold;
}

.green{
  color:#22c55e;
}

.blue{
  color:#3b82f6;
}

.orange{
  color:#ff8a00;
}

.section{
  margin-top:40px;
}

.section-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.section-title{
  font-size:28px;
  font-weight:bold;
}

.po-grid{
  display:grid;
  grid-template-columns:
  repeat(auto-fill,minmax(420px,1fr));
  gap:20px;
}

.item-card{
  background:#111827;
  border:1px solid #1f2937;
  border-radius:18px;
  padding:24px;
}

.item-title{
  font-size:22px;
  font-weight:bold;
}

.item-sub{
  color:#9ca3af;
  margin-top:6px;
}

table{
  width:100%;
  margin-top:20px;
  border-collapse:collapse;
}

th{
  color:#9ca3af;
  font-size:12px;
  font-weight:normal;
  padding-bottom:10px;
  text-align:left;
}

td{
  font-size:18px;
  font-weight:bold;
  padding-bottom:14px;
}

.edit-input{
  width:120px;
  padding:10px;
  background:#0b0f17;
  border:1px solid #374151;
  border-radius:8px;
  color:white;
}

.save-btn{
  background:#2563eb;
  border:none;
  color:white;
  padding:10px 18px;
  border-radius:8px;
  cursor:pointer;
  margin-top:18px;
}

.export-btn{
  background:#111827;
  border:1px solid #374151;
  color:white;
  padding:12px 20px;
  border-radius:10px;
  cursor:pointer;
}

.badge{
  display:inline-block;
  padding:8px 12px;
  border-radius:8px;
  font-size:12px;
  font-weight:bold;
  margin-top:18px;
}

.clean-badge{
  background:#052e16;
  color:#22c55e;
}

.auto-badge{
  background:#0a1f44;
  color:#3b82f6;
}

.review-badge{
  background:#3b0a0a;
  color:#ff8a00;
}

.reason{
  margin-top:16px;
  padding:12px;
  border-radius:10px;
  background:#1f2937;
  color:#d1d5db;
  font-size:13px;
}

.empty{
  color:#9ca3af;
  padding:20px;
}

.final-box{
  background:#0f172a;
  border:1px solid #334155;
  border-radius:12px;
  padding:14px;
  margin-top:20px;
}

.final-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:12px;
}

.final-item{
  background:#111827;
  padding:12px;
  border-radius:10px;
}

.final-label{
  color:#9ca3af;
  font-size:12px;
}

.final-value{
  font-size:20px;
  font-weight:bold;
  margin-top:5px;
}

.final-status{
  margin-top:16px;
  font-size:18px;
  font-weight:bold;
}

</style>

</head>

<body>

<div class="sidebar">

  <div class="sidebar-header">

    <div class="sidebar-title">
      TP Dashboard
    </div>

    <div class="sidebar-sub">
      Purchase Orders
    </div>

  </div>

  <div id="sidebarPOs"></div>

</div>

<div class="main">

  <div id="topDashboard"></div>

  <div id="poContent"></div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyObPqBoiSXjsy6_xhe2yXZIWWsCAMEvdtWJslas8rJ9LUsee0K7G36768jIn8tiyno/exec";

let GLOBAL_DATA = [];
let GLOBAL_GROUPED = {};

fetch(API_URL)
.then(res => res.json())
.then(data => {

  GLOBAL_DATA = data;

  buildDashboard(data);

});

/* ===================================== */

function getLineStatus(r){

  const poPrice =
    Number(r.PO_PRICE || 0);

  const ucPrice =
    Number(r.UC_PRICE || 0);

  const poMRP =
    Number(r.PO_MRP || 0);

  const ucMRP =
    Number(r.UC_MRP || 0);

  const poGST =
    Number(r.PO_GST || 0);

  const ucGST =
    Number(r.UC_GST || 0);

  const priceDiff =
    Math.abs(poPrice - ucPrice);

  const mrpMatch =
    poMRP === ucMRP;

  const gstMatch =
    poGST === ucGST;

  if(
    priceDiff === 0
    &&
    mrpMatch
    &&
    gstMatch
  ){
    return "CLEAN";
  }

  if(
    priceDiff <= 1
    &&
    mrpMatch
    &&
    gstMatch
  ){
    return "AUTO_APPROVED";
  }

  return "NEEDS_REVIEW";

}

/* ===================================== */

function buildDashboard(data){

  const grouped = {};

  data.forEach(r => {

    const po = r.PoNumber;

    if(!grouped[po]){
      grouped[po] = [];
    }

    grouped[po].push(r);

  });

  GLOBAL_GROUPED = grouped;

  let cleanPOs = 0;
  let autoPOs = 0;
  let reviewPOs = 0;

  Object.keys(grouped).forEach(po => {

    const rows = grouped[po];

    let status =
      getPOStatus(rows);

    if(status === "CLEAN"){
      cleanPOs++;
    }

    if(status === "AUTO_APPROVED"){
      autoPOs++;
    }

    if(status === "NEEDS_REVIEW"){
      reviewPOs++;
    }

  });

  document.getElementById(
    "topDashboard"
  ).innerHTML = `

    <div class="top-header">

      <div>

        <div class="page-title">
          TP Dashboard
        </div>

        <div class="page-sub">
          Instamart Validation Dashboard
        </div>

      </div>

      <button
      class="export-btn"
      onclick="exportAll()">

        EXPORT ALL

      </button>

    </div>

    <div class="summary-grid">

      <div class="summary-card"
      onclick="filterPOs('ALL')">

        <div class="summary-title">
          TOTAL POs
        </div>

        <div class="summary-value">
          ${Object.keys(grouped).length}
        </div>

      </div>

      <div class="summary-card">

        <div class="summary-title">
          PO LINES
        </div>

        <div class="summary-value">
          ${data.length}
        </div>

      </div>

      <div class="summary-card"
      onclick="filterPOs('CLEAN')">

        <div class="summary-title">
          CLEAN
        </div>

        <div class="summary-value green">
          ${cleanPOs}
        </div>

      </div>

      <div class="summary-card"
      onclick="filterPOs('AUTO_APPROVED')">

        <div class="summary-title">
          AUTO APPROVED
        </div>

        <div class="summary-value blue">
          ${autoPOs}
        </div>

      </div>

      <div class="summary-card"
      onclick="filterPOs('NEEDS_REVIEW')">

        <div class="summary-title">
          NEEDS REVIEW
        </div>

        <div class="summary-value orange">
          ${reviewPOs}
        </div>

      </div>

    </div>

  `;

  filterPOs("ALL");

}

/* ===================================== */

function getPOStatus(rows){

  let hasReview = false;
  let hasAuto = false;

  rows.forEach(r => {

    const status =
      getLineStatus(r);

    if(status === "NEEDS_REVIEW"){
      hasReview = true;
    }

    if(status === "AUTO_APPROVED"){
      hasAuto = true;
    }

  });

  if(hasReview){
    return "NEEDS_REVIEW";
  }

  if(hasAuto){
    return "AUTO_APPROVED";
  }

  return "CLEAN";

}

/* ===================================== */

function filterPOs(type){

  document
    .getElementById("sidebarPOs")
    .innerHTML = "";

  Object.keys(GLOBAL_GROUPED)
  .forEach(po => {

    const rows =
      GLOBAL_GROUPED[po];

    const status =
      getPOStatus(rows);

    let show = false;

    if(type === "ALL"){
      show = true;
    }

    if(type === status){
      show = true;
    }

    if(show){

      addSidebarPO(
        po,
        rows,
        status
      );

    }

  });

}

/* ===================================== */

function addSidebarPO(
  po,
  rows,
  status
){

  let color = "#22c55e";

  if(status === "AUTO_APPROVED"){
    color = "#3b82f6";
  }

  if(status === "NEEDS_REVIEW"){
    color = "#ff8a00";
  }

  const div =
    document.createElement("div");

  div.className = "po-item";

  div.onclick = () => {

    renderPO(po);

  };

  div.innerHTML = `

    <div class="po-title">

      ${po}

      <span class="status-dot"
      style="background:${color}">
      </span>

    </div>

    <div class="po-lines">
      ${rows.length} lines
    </div>

  `;

  document
    .getElementById("sidebarPOs")
    .appendChild(div);

}

/* ===================================== */

function renderPO(po){

  const rows =
    GLOBAL_GROUPED[po];

  let reviewHTML = "";
  let autoHTML = "";
  let cleanHTML = "";

  rows.forEach(r => {

    const poPrice =
      Number(r.PO_PRICE || 0);

    const ucPrice =
      Number(r.UC_PRICE || 0);

    const poMRP =
      Number(r.PO_MRP || 0);

    const ucMRP =
      Number(r.UC_MRP || 0);

    const poGST =
      Number(r.PO_GST || 0);

    const ucGST =
      Number(r.UC_GST || 0);

    const priceDiff =
      Math.abs(poPrice - ucPrice);

    const mrpMatch =
      poMRP === ucMRP;

    const gstMatch =
      poGST === ucGST;

    const finalStatus =
      getLineStatus(r);

    const finalPrice =
      priceDiff <= 1
      ? poPrice
      : ucPrice;

    const finalMRP =
      mrpMatch
      ? poMRP
      : ucMRP;

    const finalGST =
      gstMatch
      ? poGST
      : ucGST;

    let badge = "";

    if(finalStatus === "CLEAN"){

      badge =
      `<span class="badge clean-badge">
        CLEAN
      </span>`;

    }

    else if(
      finalStatus ===
      "AUTO_APPROVED"
    ){

      badge =
      `<span class="badge auto-badge">
        AUTO APPROVED
      </span>`;

    }

    else{

      badge =
      `<span class="badge review-badge">
        NEEDS REVIEW
      </span>`;

    }

    const card = `

      <div class="item-card">

        <div class="item-title">
          ${r.SKU_ID}
        </div>

        <div class="item-sub">
          PO ${po}
        </div>

        <table>

          <tr>
            <th>PO_PRICE</th>
            <th>UC_PRICE</th>
            <th>DIFF</th>
          </tr>

          <tr>

            <td>
              <input
              id="po_price_${r.rowNumber}"
              class="edit-input"
              value="${poPrice}">
            </td>

            <td>
              <input
              id="price_${r.rowNumber}"
              class="edit-input"
              value="${ucPrice}">
            </td>

            <td>
              ₹${priceDiff.toFixed(2)}
            </td>

          </tr>

          <tr>
            <th>PO_MRP</th>
            <th>UC_MRP</th>
            <th>STATUS</th>
          </tr>

          <tr>

            <td>
              <input
              id="po_mrp_${r.rowNumber}"
              class="edit-input"
              value="${poMRP}">
            </td>

            <td>
              <input
              id="mrp_${r.rowNumber}"
              class="edit-input"
              value="${ucMRP}">
            </td>

            <td>
              ${
                mrpMatch
                ?
                "✅ MATCH"
                :
                "❌ MISMATCH"
              }
            </td>

          </tr>

          <tr>
            <th>PO_GST</th>
            <th>UC_GST</th>
            <th>STATUS</th>
          </tr>

          <tr>

            <td>
              <input
              id="po_gst_${r.rowNumber}"
              class="edit-input"
              value="${poGST}">
            </td>

            <td>
              <input
              id="gst_${r.rowNumber}"
              class="edit-input"
              value="${ucGST}">
            </td>

            <td>
              ${
                gstMatch
                ?
                "✅ MATCH"
                :
                "❌ MISMATCH"
              }
            </td>

          </tr>

        </table>

        <div class="final-box">

          <div class="final-grid">

            <div class="final-item">

              <div class="final-label">
                FINAL PRICE
              </div>

              <div class="final-value">
                ₹${finalPrice}
              </div>

            </div>

            <div class="final-item">

              <div class="final-label">
                FINAL MRP
              </div>

              <div class="final-value">
                ₹${finalMRP}
              </div>

            </div>

            <div class="final-item">

              <div class="final-label">
                FINAL GST
              </div>

              <div class="final-value">
                ${finalGST}%
              </div>

            </div>

          </div>

          <div class="final-status">

            ${
              finalStatus === "CLEAN"
              ?
              "✅ CLEAN"
              :
              finalStatus ===
              "AUTO_APPROVED"
              ?
              "🟦 AUTO APPROVED"
              :
              "🟧 NEEDS REVIEW"
            }

          </div>

        </div>

        <button
        class="save-btn"
        onclick="saveEdit(${r.rowNumber})">

          SAVE

        </button>

        <br>

        ${badge}

      </div>

    `;

    if(finalStatus === "CLEAN"){
      cleanHTML += card;
    }

    if(
      finalStatus ===
      "AUTO_APPROVED"
    ){
      autoHTML += card;
    }

    if(
      finalStatus ===
      "NEEDS_REVIEW"
    ){
      reviewHTML += card;
    }

  });

  document.getElementById(
    "poContent"
  ).innerHTML = `

    <div class="section">

      <div class="section-header">

        <div class="section-title">
          ${po}
        </div>

        <button
        class="export-btn"
        onclick="exportPO('${po}')">

          EXPORT PO

        </button>

      </div>

    </div>

    <div class="section">

      <div class="section-title">
        Needs Review
      </div>

      <div class="po-grid">

        ${
          reviewHTML
          ||
          '<div class="empty">No review lines</div>'
        }

      </div>

    </div>

    <div class="section">

      <div class="section-title">
        Auto Approved
      </div>

      <div class="po-grid">

        ${
          autoHTML
          ||
          '<div class="empty">No auto approved lines</div>'
        }

      </div>

    </div>

    <div class="section">

      <div class="section-title">
        Clean
      </div>

      <div class="po-grid">

        ${
          cleanHTML
          ||
          '<div class="empty">No clean lines</div>'
        }

      </div>

    </div>

  `;

}

/* ===================================== */

async function saveEdit(rowNumber){

  const PO_PRICE =
    document.getElementById(
      `po_price_${rowNumber}`
    ).value;

  const PO_MRP =
    document.getElementById(
      `po_mrp_${rowNumber}`
    ).value;

  const PO_GST =
    document.getElementById(
      `po_gst_${rowNumber}`
    ).value;

  const UC_PRICE =
    document.getElementById(
      `price_${rowNumber}`
    ).value;

  const UC_GST =
    document.getElementById(
      `gst_${rowNumber}`
    ).value;

  const UC_MRP =
    document.getElementById(
      `mrp_${rowNumber}`
    ).value;

  await fetch(API_URL, {

    method:"POST",

    body: JSON.stringify({

      rowNumber,

      PO_PRICE,
      PO_MRP,
      PO_GST,

      UC_PRICE,
      UC_GST,
      UC_MRP

    })

  });

  alert("Updated Successfully");

  location.reload();

}

/* ===================================== */

function exportPO(po){

  exportCSV(
    GLOBAL_GROUPED[po],
    po + ".csv"
  );

}

function exportAll(){

  exportCSV(
    GLOBAL_DATA,
    "ALL_POS.csv"
  );

}

function exportCSV(rows, filename){

  let csvRows = [];

  csvRows.push([

    "PoNumber",
    "SKU_ID",

    "PO_PRICE",
    "UC_PRICE",
    "FINAL_PRICE",

    "PO_MRP",
    "UC_MRP",
    "FINAL_MRP",

    "PO_GST",
    "UC_GST",
    "FINAL_GST",

    "FINAL_STATUS"

  ]);

  rows.forEach(r => {

    const poPrice =
      Number(r.PO_PRICE || 0);

    const ucPrice =
      Number(r.UC_PRICE || 0);

    const poMRP =
      Number(r.PO_MRP || 0);

    const ucMRP =
      Number(r.UC_MRP || 0);

    const poGST =
      Number(r.PO_GST || 0);

    const ucGST =
      Number(r.UC_GST || 0);

    const priceDiff =
      Math.abs(poPrice - ucPrice);

    const finalPrice =
      priceDiff <= 1
      ? poPrice
      : ucPrice;

    const finalMRP =
      poMRP === ucMRP
      ? poMRP
      : ucMRP;

    const finalGST =
      poGST === ucGST
      ? poGST
      : ucGST;

    const finalStatus =
      getLineStatus(r);

    csvRows.push([

      r.PoNumber,
      r.SKU_ID,

      poPrice,
      ucPrice,
      finalPrice,

      poMRP,
      ucMRP,
      finalMRP,

      poGST,
      ucGST,
      finalGST,

      finalStatus

    ]);

  });

  let csvContent =
    csvRows
    .map(row =>
      row.join(",")
    )
    .join("\n");

  const blob =
    new Blob(
      [csvContent],
      {
        type:
        "text/csv;charset=utf-8;"
      }
    );

  const link =
    document.createElement("a");

  const url =
    URL.createObjectURL(blob);

  link.setAttribute(
    "href",
    url
  );

  link.setAttribute(
    "download",
    filename
  );

  document.body
    .appendChild(link);

  link.click();

  document.body
    .removeChild(link);

}

</script>

</body>

</html>
