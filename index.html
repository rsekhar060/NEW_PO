<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbwn45en_PUwL6kVHWQS3rg6zPMcDVMaVN32qlTQMtpWcGie_UjARb2I-t9XTSMQfCwm/exec";

let GLOBAL_DATA = [];
let GLOBAL_GROUPED = {};

fetch(API_URL)
.then(res => res.json())
.then(data => {

  GLOBAL_DATA = data;

  processDashboard(data);

});

/* ========================= */

function processDashboard(data){

  const grouped = {};

  data.forEach(r => {

    const po = r.PoNumber;

    if(!grouped[po]){
      grouped[po] = [];
    }

    grouped[po].push(r);

  });

  GLOBAL_GROUPED = grouped;

  document.getElementById("totalPOs")
    .innerText = Object.keys(grouped).length;

  document.getElementById("totalLines")
    .innerText = data.length;

  let clean = 0;
  let review = 0;
  let refresh = 0;

  Object.keys(grouped).forEach(po => {

    const rows = grouped[po];

    let reviewCount = 0;
    let cleanCount = 0;
    let refreshCount = 0;

    rows.forEach(r => {

      const diff =
        Math.abs(
          Number(r.PO_PRICE || 0)
          -
          Number(r.UC_PRICE || 0)
        );

      if(diff === 0){
        cleanCount++;
      }
      else if(diff <= 1){
        refreshCount++;
      }
      else{
        reviewCount++;
      }

    });

    if(cleanCount === rows.length){
      clean++;
    }

    if(reviewCount > 0){
      review++;
    }

    if(refreshCount > 0){
      refresh++;
    }

    createSidebarPO(
      po,
      rows,
      cleanCount,
      reviewCount,
      refreshCount
    );

  });

  document.getElementById("cleanCount")
    .innerText = clean;

  document.getElementById("approvedCount")
    .innerText = refresh;

  document.getElementById("reviewCount")
    .innerText = review;

  const firstPO =
    Object.keys(grouped)[0];

  renderPO(firstPO);

}

/* ========================= */

function createSidebarPO(
  po,
  rows,
  cleanCount,
  reviewCount,
  refreshCount
){

  let color = "#22c55e";

  if(reviewCount > 0){
    color = "#ff8a00";
  }
  else if(refreshCount > 0){
    color = "#3b82f6";
  }

  const div =
    document.createElement("div");

  div.className = "po-item";

  div.onclick = () => renderPO(po);

  div.innerHTML = `

    <div class="po-title">

      ${po}

      <span class="status-dot"
      style="background:${color}">
      </span>

    </div>

    <div class="po-lines">
      ${rows.length} lines
    </div>

  `;

  document
    .getElementById("sidebarPOs")
    .appendChild(div);

}

/* ========================= */

function renderPO(po){

  const rows =
    GLOBAL_GROUPED[po];

  let cleanHTML = "";
  let refreshHTML = "";
  let reviewHTML = "";

  rows.forEach(r => {

    const poPrice =
      Number(r.PO_PRICE || 0);

    const ucPrice =
      Number(r.UC_PRICE || 0);

    const diff =
      Math.abs(poPrice - ucPrice);

    let section = "";

    if(diff === 0){
      section = "clean";
    }
    else if(diff <= 1){
      section = "refresh";
    }
    else{
      section = "review";
    }

    const card = `

    <div class="po-card">

      <div class="po-header">

        <div>

          <div class="po-name">
            ${r.SKU_ID}
          </div>

          <div class="po-sub">
            PO ${po}
          </div>

        </div>

      </div>

      <br>

      <table>

        <tr>
          <th>PO_PRICE</th>
          <th>UC_PRICE</th>
          <th>DIFF</th>
        </tr>

        <tr>

          <td>₹${poPrice}</td>

          <td>₹${ucPrice}</td>

          <td>
            ₹${diff.toFixed(2)}
          </td>

        </tr>

      </table>

      <br>

      ${
        section === "review"
        ?
        `
        <span class="badge review">
          NEEDS REVIEW
        </span>
        `
        :
        ""
      }

      ${
        section === "refresh"
        ?
        `
        <span class="badge approved">
          AUTO APPROVED
        </span>
        `
        :
        ""
      }

      ${
        section === "clean"
        ?
        `
        <span class="badge clean">
          CLEAN
        </span>
        `
        :
        ""
      }

    </div>

    `;

    if(section === "clean"){
      cleanHTML += card;
    }

    if(section === "refresh"){
      refreshHTML += card;
    }

    if(section === "review"){
      reviewHTML += card;
    }

  });

  document.querySelector(".main").innerHTML = `

  <div class="header">

    <div class="header-left">
      <h1>${po}</h1>
      <p>${rows.length} lines</p>
    </div>

    <button class="export-btn"
      onclick="exportPO('${po}')">

      EXPORT PO

    </button>

  </div>

  <div class="cards">

    <div class="card">
      <div class="card-title">
        TOTAL LINES
      </div>
      <div class="card-value">
        ${rows.length}
      </div>
    </div>

  </div>

  <h2 class="section-title">
    Needs Review
  </h2>

  <div class="po-grid">
    ${reviewHTML || 'No review items'}
  </div>

  <h2 class="section-title">
    Auto Approved
  </h2>

  <div class="po-grid">
    ${refreshHTML || 'No auto approvals'}
  </div>

  <h2 class="section-title">
    Clean
  </h2>

  <div class="po-grid">
    ${cleanHTML || 'No clean items'}
  </div>

  `;

}

/* ========================= */

function exportPO(po){

  const rows =
    GLOBAL_GROUPED[po];

  let csv =
`PoNumber,SKU_ID,PO_PRICE,UC_PRICE,DIFF,STATUS\n`;

  rows.forEach(r => {

    const diff =
      Math.abs(
        Number(r.PO_PRICE || 0)
        -
        Number(r.UC_PRICE || 0)
      );

    let status = "REVIEW";

    if(diff === 0){
      status = "CLEAN";
    }
    else if(diff <= 1){
      status = "AUTO_APPROVED";
    }

    csv +=
`${r.PoNumber},
${r.SKU_ID},
${r.PO_PRICE},
${r.UC_PRICE},
${diff},
${status}\n`;

  });

  const blob =
    new Blob([csv], {type:'text/csv'});

  const a =
    document.createElement('a');

  a.href =
    URL.createObjectURL(blob);

  a.download =
    po + ".csv";

  a.click();

}

</script>
