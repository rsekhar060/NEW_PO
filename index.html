<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>TP Dashboard</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#050816;
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  height:100vh;
  overflow:hidden;
}

/* ======================= */

.sidebar{
  width:320px;
  background:#0f172a;
  border-right:1px solid #1e293b;
  overflow-y:auto;
}

.sidebar-header{
  padding:24px;
  border-bottom:1px solid #1e293b;
}

.sidebar-title{
  font-size:24px;
  font-weight:bold;
}

.sidebar-sub{
  color:#94a3b8;
  margin-top:6px;
}

.po-item{
  padding:22px;
  border-bottom:1px solid #1e293b;
  cursor:pointer;
}

.po-item:hover{
  background:#172033;
}

.po-title{
  font-size:18px;
  font-weight:bold;
}

.po-lines{
  color:#94a3b8;
  margin-top:5px;
}

.status-dot{
  width:12px;
  height:12px;
  border-radius:50%;
  float:right;
  margin-top:8px;
}

/* ======================= */

.main{
  flex:1;
  overflow-y:auto;
  padding:36px;
}

.top-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.page-title{
  font-size:56px;
  font-weight:bold;
}

.page-sub{
  color:#94a3b8;
  margin-top:8px;
}

.export-btn{
  background:#0f172a;
  border:1px solid #334155;
  color:white;
  padding:14px 22px;
  border-radius:12px;
  cursor:pointer;
}

.summary-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:18px;
  margin-bottom:40px;
}

.summary-card{
  background:#0f172a;
  border:1px solid #1e293b;
  border-radius:18px;
  padding:24px;
  cursor:pointer;
}

.summary-title{
  color:#94a3b8;
  font-size:13px;
  margin-bottom:12px;
}

.summary-value{
  font-size:52px;
  font-weight:bold;
}

.green{
  color:#22c55e;
}

.blue{
  color:#3b82f6;
}

.orange{
  color:#ff9800;
}

.purple{
  color:#a855f7;
}

/* ======================= */

.section{
  margin-top:40px;
}

.section-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:24px;
}

.section-title{
  font-size:42px;
  font-weight:bold;
}

.po-grid{
  display:grid;
  grid-template-columns:
  repeat(auto-fill,minmax(520px,1fr));
  gap:24px;
}

/* ======================= */

.item-card{
  background:#0f172a;
  border:1px solid #1e293b;
  border-radius:20px;
  padding:28px;
}

.item-title{
  font-size:34px;
  font-weight:bold;
}

.item-sub{
  color:#94a3b8;
  margin-top:6px;
}

table{
  width:100%;
  margin-top:24px;
}

th{
  color:#94a3b8;
  text-align:left;
  padding-bottom:10px;
}

td{
  padding-bottom:22px;
  font-size:18px;
  font-weight:bold;
}

.edit-input{
  width:160px;
  padding:14px;
  background:#020617;
  border:1px solid #334155;
  border-radius:12px;
  color:white;
  font-size:18px;
}

.final-box{
  background:#091226;
  border:1px solid #243041;
  border-radius:18px;
  padding:20px;
  margin-top:20px;
}

.final-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.final-item{
  background:#111827;
  border-radius:12px;
  padding:16px;
}

.final-label{
  color:#94a3b8;
  font-size:13px;
}

.final-value{
  margin-top:8px;
  font-size:24px;
  font-weight:bold;
}

.final-status{
  margin-top:20px;
  font-size:24px;
  font-weight:bold;
}

.save-btn{
  background:#2563eb;
  border:none;
  color:white;
  padding:14px 24px;
  border-radius:12px;
  cursor:pointer;
  font-size:18px;
  margin-top:24px;
}

</style>

</head>

<body>

<div class="sidebar">

  <div class="sidebar-header">

    <div class="sidebar-title">
      TP Dashboard
    </div>

    <div class="sidebar-sub">
      Purchase Orders
    </div>

  </div>

  <div id="sidebarPOs"></div>

</div>

<div class="main">

  <div id="topDashboard"></div>

  <div id="poContent"></div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbzjwKvd9784B98uQpgU6FMkPxQk1ck8t2tLZbnLCpE6-p7nwRwqOmMwJcG9m-FVoc4f/exec";

let GLOBAL_DATA = [];
let GLOBAL_GROUPED = {};

/* ========================= */

fetch(API_URL)
.then(res => res.json())
.then(data => {

  GLOBAL_DATA = data;

  buildDashboard(data);

});

/* ========================= */

function getLineStatus(r){

  if(r.REVIEWED === "YES"){
    return "REVIEWED";
  }

  const poPrice =
    Number(r.PO_PRICE || 0);

  const ucPrice =
    Number(r.UC_PRICE || 0);

  const poMRP =
    Number(r.PO_MRP || 0);

  const ucMRP =
    Number(r.UC_MRP || 0);

  const poGST =
    Number(r.PO_GST || 0);

  const ucGST =
    Number(r.UC_GST || 0);

  const diff =
    Math.abs(poPrice - ucPrice);

  const mrpMatch =
    poMRP === ucMRP;

  const gstMatch =
    poGST === ucGST;

  if(
    diff === 0
    &&
    mrpMatch
    &&
    gstMatch
  ){
    return "CLEAN";
  }

  if(
    diff <= 1
    &&
    mrpMatch
    &&
    gstMatch
  ){
    return "AUTO_APPROVED";
  }

  return "NEEDS_REVIEW";

}

/* ========================= */

function getPOStatus(rows){

  let hasReview = false;
  let hasReviewed = false;
  let hasAuto = false;

  rows.forEach(r => {

    const s =
      getLineStatus(r);

    if(s === "NEEDS_REVIEW"){
      hasReview = true;
    }

    if(s === "REVIEWED"){
      hasReviewed = true;
    }

    if(s === "AUTO_APPROVED"){
      hasAuto = true;
    }

  });

  if(hasReviewed){
    return "REVIEWED";
  }

  if(hasReview){
    return "NEEDS_REVIEW";
  }

  if(hasAuto){
    return "AUTO_APPROVED";
  }

  return "CLEAN";

}

/* ========================= */

function buildDashboard(data){

  const grouped = {};

  data.forEach(r => {

    const po = r.PoNumber;

    if(!grouped[po]){
      grouped[po] = [];
    }

    grouped[po].push(r);

  });

  GLOBAL_GROUPED = grouped;

  let clean = 0;
  let auto = 0;
  let review = 0;
  let reviewed = 0;

  Object.keys(grouped).forEach(po => {

    const s =
      getPOStatus(grouped[po]);

    if(s === "CLEAN") clean++;
    if(s === "AUTO_APPROVED") auto++;
    if(s === "NEEDS_REVIEW") review++;
    if(s === "REVIEWED") reviewed++;

  });

  document
  .getElementById("topDashboard")
  .innerHTML = `

    <div class="top-header">

      <div>

        <div class="page-title">
          TP Dashboard
        </div>

        <div class="page-sub">
          Instamart Validation Dashboard
        </div>

      </div>

      <button
      class="export-btn"
      onclick="exportAll()">

        EXPORT ALL

      </button>

    </div>

    <div class="summary-grid">

      <div class="summary-card"
      onclick="filterPOs('ALL')">

        <div class="summary-title">
          TOTAL POs
        </div>

        <div class="summary-value">
          ${Object.keys(grouped).length}
        </div>

      </div>

      <div class="summary-card"
      onclick="filterPOs('CLEAN')">

        <div class="summary-title">
          CLEAN
        </div>

        <div class="summary-value green">
          ${clean}
        </div>

      </div>

      <div class="summary-card"
      onclick="filterPOs('AUTO_APPROVED')">

        <div class="summary-title">
          AUTO APPROVED
        </div>

        <div class="summary-value blue">
          ${auto}
        </div>

      </div>

      <div class="summary-card"
      onclick="filterPOs('NEEDS_REVIEW')">

        <div class="summary-title">
          NEEDS REVIEW
        </div>

        <div class="summary-value orange">
          ${review}
        </div>

      </div>

      <div class="summary-card"
      onclick="filterPOs('REVIEWED')">

        <div class="summary-title">
          REVIEWED
        </div>

        <div class="summary-value purple">
          ${reviewed}
        </div>

      </div>

      <div class="summary-card">

        <div class="summary-title">
          PO LINES
        </div>

        <div class="summary-value">
          ${data.length}
        </div>

      </div>

    </div>

  `;

  filterPOs("ALL");

}

/* ========================= */

function filterPOs(type){

  document
  .getElementById("sidebarPOs")
  .innerHTML = "";

  Object.keys(GLOBAL_GROUPED)
  .forEach(po => {

    const rows =
      GLOBAL_GROUPED[po];

    const status =
      getPOStatus(rows);

    if(type === "ALL" || status === type){

      addSidebarPO(
        po,
        rows,
        status
      );

    }

  });

}

/* ========================= */

function addSidebarPO(
  po,
  rows,
  status
){

  let color = "#22c55e";

  if(status === "AUTO_APPROVED"){
    color = "#3b82f6";
  }

  if(status === "NEEDS_REVIEW"){
    color = "#ff9800";
  }

  if(status === "REVIEWED"){
    color = "#a855f7";
  }

  const div =
    document.createElement("div");

  div.className = "po-item";

  div.onclick = () => {

    renderPO(po);

  };

  div.innerHTML = `

    <div class="po-title">

      ${po}

      <span class="status-dot"
      style="background:${color}">
      </span>

    </div>

    <div class="po-lines">
      ${rows.length} lines
    </div>

  `;

  document
  .getElementById("sidebarPOs")
  .appendChild(div);

}

/* ========================= */

function renderPO(po){

  const rows =
    GLOBAL_GROUPED[po];

  let html = "";

  rows.forEach(r => {

    const poPrice =
      Number(r.PO_PRICE || 0);

    const ucPrice =
      Number(r.UC_PRICE || 0);

    const poMRP =
      Number(r.PO_MRP || 0);

    const ucMRP =
      Number(r.UC_MRP || 0);

    const poGST =
      Number(r.PO_GST || 0);

    const ucGST =
      Number(r.UC_GST || 0);

    const diff =
      Math.abs(poPrice - ucPrice);

    const finalStatus =
      getLineStatus(r);

    html += `

      <div class="item-card">

        <div class="item-title">
          ${r.SKU_ID}
        </div>

        <div class="item-sub">
          ${po}
        </div>

        <table>

          <tr>
            <th>PO_PRICE</th>
            <th>UC_PRICE</th>
            <th>DIFF</th>
          </tr>

          <tr>

            <td>
              <input
              id="po_price_${r.rowNumber}"
              class="edit-input"
              value="${poPrice}">
            </td>

            <td>
              <input
              id="price_${r.rowNumber}"
              class="edit-input"
              value="${ucPrice}">
            </td>

            <td>
              ₹${diff.toFixed(2)}
            </td>

          </tr>

          <tr>
            <th>PO_MRP</th>
            <th>UC_MRP</th>
            <th>STATUS</th>
          </tr>

          <tr>

            <td>
              <input
              id="po_mrp_${r.rowNumber}"
              class="edit-input"
              value="${poMRP}">
            </td>

            <td>
              <input
              id="mrp_${r.rowNumber}"
              class="edit-input"
              value="${ucMRP}">
            </td>

            <td>
              ${
                poMRP === ucMRP
                ? "✅ MATCH"
                : "❌ MISMATCH"
              }
            </td>

          </tr>

          <tr>
            <th>PO_GST</th>
            <th>UC_GST</th>
            <th>STATUS</th>
          </tr>

          <tr>

            <td>
              <input
              id="po_gst_${r.rowNumber}"
              class="edit-input"
              value="${poGST}">
            </td>

            <td>
              <input
              id="gst_${r.rowNumber}"
              class="edit-input"
              value="${ucGST}">
            </td>

            <td>
              ${
                poGST === ucGST
                ? "✅ MATCH"
                : "❌ MISMATCH"
              }
            </td>

          </tr>

        </table>

        <div class="final-box">

          <div class="final-status">

            ${
              finalStatus === "CLEAN"
              ? "✅ CLEAN"

              :

              finalStatus === "AUTO_APPROVED"
              ? "🟦 AUTO APPROVED"

              :

              finalStatus === "REVIEWED"
              ? "🟪 REVIEWED"

              :

              "🟧 NEEDS REVIEW"
            }

          </div>

        </div>

        <button
        class="save-btn"
        onclick="saveEdit(${r.rowNumber})">

          SAVE

        </button>

      </div>

    `;

  });

  document
  .getElementById("poContent")
  .innerHTML = `

    <div class="section">

      <div class="section-header">

        <div class="section-title">
          ${po}
        </div>

      </div>

      <div class="po-grid">

        ${html}

      </div>

    </div>

  `;

}

/* ========================= */

async function saveEdit(rowNumber){

  const PO_PRICE =
    document.getElementById(
      `po_price_${rowNumber}`
    ).value;

  const PO_MRP =
    document.getElementById(
      `po_mrp_${rowNumber}`
    ).value;

  const PO_GST =
    document.getElementById(
      `po_gst_${rowNumber}`
    ).value;

  const UC_PRICE =
    document.getElementById(
      `price_${rowNumber}`
    ).value;

  const UC_GST =
    document.getElementById(
      `gst_${rowNumber}`
    ).value;

  const UC_MRP =
    document.getElementById(
      `mrp_${rowNumber}`
    ).value;

  try{

    await fetch(API_URL, {

      method:"POST",

      mode:"no-cors",

      headers:{
        "Content-Type":"text/plain"
      },

      body: JSON.stringify({

        rowNumber,

        PO_PRICE,
        PO_MRP,
        PO_GST,

        UC_PRICE,
        UC_GST,
        UC_MRP,

        REVIEWED:"YES"

      })

    });

    alert(
      "Saved Successfully"
    );

    setTimeout(() => {

      location.reload();

    },1000);

  }catch(error){

    console.log(error);

    alert(
      "Save Failed"
    );

  }

}

</script>

</body>
</html>
